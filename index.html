<!DOCTYPE html>
<html lang="en">
  <head>

    <title>ArchiWiki</title>

    <meta name="description" content="A highly secure, offline-first, minimalist Markdown note-taking app with client-side encryption and Obsidian-style wiki-linking." />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
