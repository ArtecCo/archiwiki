<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#F5F2EB" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArchiWiki" />
    <meta name="title" content="ArchiWiki | Personal Encrypted WikiPedia" />
    <meta name="description" content="ArchiWiki is a personal WikiPedia application with zero knowledge encryption and privacy-first approach." />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archiwiki.netlify.app/" />
    <meta property="og:title" content="ArchiWiki | Personal Encrypted WikiPedia" />

    <meta property="og:image" content="https://i.ibb.co/SwsRC3Ys/AWOG.png" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://archiwiki.netlify.app/" />
    <meta property="twitter:title" content="ArchiWiki | Personal Encrypted WikiPedia" />
    <meta property="twitter:description" content="ArchiWiki is a personal WikiPedia application with zero knowledge encryption and privacy-first approach." />
    <meta property="twitter:image" content="https://i.ibb.co/SwsRC3Ys/AWOG.png" />
    <link rel="icon" type="image/png" href="/A.png" />
    <link rel="apple-touch-icon" href="/A.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <script>
      (function () {
        const theme = localStorage.getItem("archiwiki-theme") || "beige";
        const themes = {
          beige: { background: "#F5F2EB", foreground: "#3F372B", muted: "#8A8176" },
          wikipedia: { background: "#F8F9FA", foreground: "#202122", muted: "#72777D" },
          charcoal: { background: "#171717", foreground: "#F5F5F5", muted: "#A3A3A3" }
        };
        const selected = themes[theme] || themes.beige;
        document.documentElement.style.backgroundColor = selected.background;
        document.body.style.backgroundColor = selected.background;
        document.body.innerHTML = `
          <div id="archiwiki-loader" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:${selected.background};color:${selected.foreground};font-family:Georgia,'Times New Roman',serif;transition:opacity 420ms ease,visibility 420ms ease">
            <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center">
              <div style="width:28px;height:28px;border:1px solid ${selected.foreground};transform:rotate(45deg);margin-bottom:24px;opacity:.8;animation:archiwikiLoaderPulse 1.5s ease-in-out infinite"></div>
              <div style="font-family:'Cinzel',serif;font-size:18px;font-weight:600;letter-spacing:.08em">ArchiWiki</div>
              <div style="width:42px;height:1px;margin-top:14px;background:${selected.muted};opacity:.55;animation:archiwikiLoaderLine 1.5s ease-in-out infinite"></div>
            </div>
          </div>
          <style>
            @keyframes archiwikiLoaderPulse { 0%,100% { transform:rotate(45deg) scale(.88); opacity:.45 } 50% { transform:rotate(45deg) scale(1); opacity:.9 } }
            @keyframes archiwikiLoaderLine { 0%,100% { transform:scaleX(.55); opacity:.3 } 50% { transform:scaleX(1); opacity:.7 } }
          </style>`;
        window.__ARCHIWIKI_LOADER_READY__ = true;
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
